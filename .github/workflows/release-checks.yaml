# Temporary: checks for the 0.2.0 CRAN submission that need the internet,
# which the machine preparing the release didn't have. Removed again before
# the release PR is merged.
on:
  pull_request:
  workflow_dispatch:

name: release-checks.yaml

permissions: read-all

jobs:
  release-checks:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::urlchecker, any::spelling, any::rcmdcheck
          needs: check

      - name: URL check
        run: |
          res <- urlchecker::url_check()
          print(res)
          cat("URLs with problems:", nrow(res), "\n")
        shell: Rscript {0}

      - name: Spelling
        run: |
          res <- devtools::spell_check()
          print(res)
          cat("Possibly misspelled words:", nrow(res), "\n")
        shell: Rscript {0}

      - name: R CMD check as CRAN, with remote and incoming checks and the PDF manual
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: true
        run: |
          res <- devtools::check(cran = TRUE, remote = TRUE, incoming = TRUE, manual = TRUE,
                                 env_vars = c(NOT_CRAN = "false"), error_on = "never")
          print(res)
        shell: Rscript {0}
