url: https://josh45-source.github.io/glyph/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Fira Code"}
  opengraph:
    twitter:
      creator: "@joshayo"
      card: summary_large_image

home:
  title: "glyph: A Grammar of Interactive Graphics"
  description: >
    An R package that builds interactive plots from a declarative spec and
    draws them with D3. Tooltips, zoom, brushing, animation and multi-plot
    layouts are declared in the same pipeline as the marks.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github, cran]
  components:
    articles:
      text: Articles
      menu:
      - text: "Getting Started"
        href: articles/getting-started.html
      - text: "Adding a custom mark"
        href: articles/custom-marks.html
    github:
      icon: fa-github
      href: https://github.com/josh45-source/glyph
      aria-label: GitHub
    cran:
      icon: fa-box-archive
      href: https://cran.r-project.org/package=glyph
      aria-label: CRAN

reference:
- title: Core
  desc: Build and inspect the visualization spec.
  contents:
  - glyph
  - print.glyph_spec
  - summary.glyph_spec

- title: Marks
  desc: Geometric layers that draw data onto the plot.
  contents:
  - marks
  - mark_point
  - mark_line
  - mark_bar
  - mark_area
  - mark_text
  - mark_rule
  - mark_ribbon
  - mark_link
  - mark_polygon

- title: Statistical marks
  desc: Marks that summarise the distribution of a variable.
  contents:
  - mark_boxplot
  - mark_violin
  - mark_sina
  - mark_histogram

- title: Interactivity
  desc: Tooltips, zoom, brushing, and linked selections.
  contents:
  - interactivity
  - interact
  - selection

- title: Animation
  desc: Transitions and entrance/exit animation.
  contents:
  - animation
  - animate

- title: Scales
  desc: Control how data maps to visual properties.
  contents:
  - scale
  - scales

- title: Theming
  desc: Token-based theme system and plot titles.
  contents:
  - theming
  - theme_tokens
  - titles

- title: Layout
  desc: Multi-plot composition and auxiliary panels.
  contents:
  - layout
  - compose
  - print.glyph_layout
  - summary.glyph_layout
  - marginals
  - inset
  - facet

- title: Rendering
  desc: Compile the spec and render or export it.
  contents:
  - rendering
  - compile
  - render
  - export
  - to_vegalite

articles:
- title: Get started
  navbar: ~
  contents:
  - getting-started

- title: Extending glyph
  contents:
  - custom-marks

footer:
  structure:
    left: developed_by
    right: built_with
